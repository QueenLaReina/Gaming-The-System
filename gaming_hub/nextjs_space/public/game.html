<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Details | Gaming The System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #1e293b; --bg2: #0f172a; --bg3: var(--bg2);
      --surface: rgba(30, 41, 59, 0.85); --accent: #38bdf8; --accent2: #a855f7;
      --text: #f8fafc; --muted: #cbd5e1; --focus-ring: #fbbf24;
      --pos: #15803d; --mix: #b45309; --neg: #b91c1c;
      --font-heading: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Open Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; color: var(--text); font-family: var(--font-body); line-height: 1.6;
      background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%) fixed;
    }
    body.light { --focus-ring: #7c3aed; }
    a { color: var(--accent); }
    :focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 3px; }
    .skip-link { position: absolute; left: -999px; top: 0; background: #000; color: #fff; padding: .5rem 1rem; z-index: 50; }
    .skip-link:focus { left: 1rem; top: 1rem; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 1.25rem; }

    /* Hero header: ~1/3 of the screen */
    .hero { position: relative; height: 34vh; min-height: 240px; overflow: hidden; background: #000; }
    .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,.15) 35%, rgba(0,0,0,.85) 100%);
    }
    .hero-top { position: absolute; top: 1rem; left: 0; right: 0; z-index: 2; }
    .hero-content { position: absolute; bottom: 1.25rem; left: 0; right: 0; z-index: 2; color: #fff; }
    .back-link {
      display: inline-flex; align-items: center; gap: .4rem; background: rgba(0,0,0,.65); color: #fff;
      text-decoration: none; padding: .45rem .9rem; border-radius: 999px; font-weight: 600; font-size: .875rem;
      border: 1px solid rgba(255,255,255,.35);
    }
    .back-link:hover { background: rgba(0,0,0,.85); }
    .hero h1 { font-family: var(--font-heading); font-size: clamp(1.8rem, 4.5vw, 3rem); line-height: 1.1; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
    .hero-meta { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .6rem; }
    .pill { background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.35); color: #fff; padding: .15rem .6rem; border-radius: 999px; font-size: .78rem; font-weight: 600; }

    main { padding: 2rem 0 3rem; }
    .tagline { font-size: 1.15rem; color: var(--muted); max-width: 820px; margin-bottom: 1.75rem; }
    .grid-2 { display: grid; grid-template-columns: 1.2fr 1fr; gap: 1.5rem; margin-bottom: 2.5rem; }
    @media (max-width: 820px) { .grid-2 { grid-template-columns: 1fr; } }
    .panel {
      background: var(--surface); border-radius: 14px; padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,.25); backdrop-filter: blur(6px);
    }
    body.light .panel { box-shadow: 0 10px 30px rgba(60, 80, 100, .15); }
    .panel h2, .section-title { font-family: var(--font-heading); font-size: 1.3rem; margin-bottom: 1rem; }
    .panel h2 span, .section-title span { color: var(--accent); }
    .hl-list { list-style: none; display: grid; gap: .6rem; }
    .hl-list li { display: flex; gap: .6rem; }
    .hl-list li::before { content: "✓"; color: var(--accent); font-weight: 700; }
    .hw { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.25rem; }
    .hw span { border: 1px solid var(--accent); color: var(--text); border-radius: 6px; padding: .2rem .6rem; font-size: .8rem; font-weight: 600; }
    .actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.25rem; }
    .btn { display: inline-flex; align-items: center; gap: .45rem; padding: .65rem 1rem; border-radius: 8px; font-weight: 700; text-decoration: none; font-size: .9rem; }
    .btn-yt { background: #dc2626; color: #fff; }
    .btn-yt:hover { background: #b91c1c; }

    /* Sentiment infographic */
    .meter { display: flex; height: 18px; border-radius: 999px; overflow: hidden; margin: .25rem 0 1rem; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
    .meter div { height: 100%; }
    .m-pos { background: #22c55e; } .m-mix { background: #f59e0b; } .m-neg { background: #ef4444; }
    .tally { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; }
    .tally button {
      font: inherit; cursor: pointer; border-radius: 10px; padding: .7rem .5rem; text-align: center;
      background: transparent; color: var(--text); border: 2px solid transparent;
    }
    .tally button[aria-pressed="true"] { border-color: var(--accent); }
    .tally strong { display: block; font-family: var(--font-heading); font-size: 1.6rem; line-height: 1.1; }
    .t-pos strong { color: #22c55e; } .t-mix strong { color: #f59e0b; } .t-neg strong { color: #ef4444; }
    body.light .t-pos strong { color: #15803d; } body.light .t-mix strong { color: #a16207; } body.light .t-neg strong { color: #b91c1c; }
    .tally small { color: var(--muted); font-size: .78rem; }
    .note { font-size: .82rem; color: var(--muted); margin-top: 1rem; }
    .show-all { margin-top: .75rem; font: inherit; font-size: .85rem; background: none; border: none; color: var(--accent); text-decoration: underline; cursor: pointer; }

    .opinions { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.1rem; }
    .op {
      background: var(--surface); border-radius: 14px; padding: 1.25rem; display: flex; flex-direction: column; gap: .75rem;
      border-top: 5px solid var(--mix-c, #f59e0b); box-shadow: 0 8px 22px rgba(0,0,0,.22);
    }
    body.light .op { box-shadow: 0 8px 22px rgba(60, 80, 100, .14); }
    .op.positive { border-top-color: #22c55e; } .op.mixed { border-top-color: #f59e0b; } .op.negative { border-top-color: #ef4444; }
    .badge { align-self: flex-start; font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: .2rem .55rem; border-radius: 4px; color: #fff; }
    .badge.positive { background: var(--pos); } .badge.mixed { background: var(--mix); } .badge.negative { background: var(--neg); }
    .op blockquote a { color: var(--text); text-decoration: none; font-size: 1rem; line-height: 1.55; }
    .op blockquote a:hover { text-decoration: underline; text-decoration-color: var(--accent); }
    .op blockquote a::before { content: "\201C"; color: var(--accent); font-weight: 700; }
    .op blockquote a::after { content: "\201D"; color: var(--accent); font-weight: 700; }
    .op .who { margin-top: auto; font-size: .85rem; }
    .op .who a { font-weight: 700; color: var(--accent); }
    .op .who span { display: block; color: var(--muted); font-size: .8rem; }
    .notfound { padding: 4rem 0; text-align: center; }
    footer { text-align: center; font-size: .82rem; color: var(--muted); padding: 1.5rem 0 2.5rem; }
  </style>
  <script src="game-details-data.js"></script>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="app"></div>

  <script>
    (function () {
      const app = document.getElementById("app");
      const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const id = new URLSearchParams(window.location.search).get("id");
      const g = (window.GAME_DETAILS || {})[id];

      if (!g) {
        app.innerHTML = `<main id="main" class="container notfound"><h1 style="font-family:var(--font-heading)">Game page not found</h1>
          <p style="margin:1rem 0">We don't have a details page for this title yet.</p><a class="back-link" href="gaming-hub.html">← Back to catalog</a></main>`;
        return;
      }

      const t = g.theme, root = document.documentElement.style;
      root.setProperty("--bg1", t.bg1); root.setProperty("--bg2", t.bg2); root.setProperty("--bg3", t.bg3 || t.bg2);
      root.setProperty("--surface", t.surface); root.setProperty("--accent", t.accent); root.setProperty("--accent2", t.accent2);
      root.setProperty("--text", t.text); root.setProperty("--muted", t.muted);
      if (t.mode === "light") document.body.classList.add("light");
      document.title = `${g.title} | Accessibility Details & Player Opinions`;

      const counts = { positive: 0, mixed: 0, negative: 0 };
      g.opinions.forEach(o => counts[o.sentiment]++);
      const total = g.opinions.length;
      const pct = n => (n / total * 100).toFixed(1);
      const label = { positive: "Positive", mixed: "Mixed", negative: "Negative" };

      app.innerHTML = `
        <header class="hero">
          <img id="hero-img" src="https://img.youtube.com/vi/${g.trailerId}/maxresdefault.jpg" alt="${esc(g.title)} key scene from the official trailer">
          <div class="hero-top container"><a class="back-link" href="gaming-hub.html">← Back to catalog</a></div>
          <div class="hero-content container">
            <h1>${esc(g.title)}</h1>
            <div class="hero-meta">
              <span class="pill">${g.releaseYear}</span>
              ${g.genres.map(x => `<span class="pill">${esc(x)}</span>`).join("")}
              ${g.platforms.map(x => `<span class="pill">${esc(x)}</span>`).join("")}
            </div>
          </div>
        </header>

        <main id="main" class="container">
          <p class="tagline">${esc(g.tagline)}</p>

          <div class="grid-2">
            <section class="panel" aria-labelledby="feat-h">
              <h2 id="feat-h"><span>◆</span> Motor Accessibility at a Glance</h2>
              <ul class="hl-list">${g.highlights.map(h => `<li>${esc(h)}</li>`).join("")}</ul>
              <div class="hw" aria-label="Adaptive hardware">${g.hardware.map(h => `<span>⚡ ${esc(h)}</span>`).join("")}</div>
              <div class="actions">
                <a class="btn btn-yt" href="https://www.youtube.com/watch?v=${g.trailerId}" target="_blank" rel="noopener noreferrer" aria-label="Watch ${esc(g.title)} gameplay trailer on YouTube (opens in a new tab)">▶ Watch Gameplay Trailer ↗</a>
              </div>
            </section>

            <section class="panel" aria-labelledby="mood-h">
              <h2 id="mood-h"><span>◆</span> How People Actually Feel</h2>
              <div class="meter" role="img" aria-label="${counts.positive} positive, ${counts.mixed} mixed, ${counts.negative} negative out of ${total} opinions">
                <div class="m-pos" style="width:${pct(counts.positive)}%"></div>
                <div class="m-mix" style="width:${pct(counts.mixed)}%"></div>
                <div class="m-neg" style="width:${pct(counts.negative)}%"></div>
              </div>
              <div class="tally" role="group" aria-label="Filter opinions by sentiment">
                ${["positive", "mixed", "negative"].map(s => `
                  <button type="button" class="t-${s.slice(0, 3)}" data-filter="${s}" aria-pressed="false">
                    <strong>${counts[s]}</strong><small>${label[s]}</small>
                  </button>`).join("")}
              </div>
              <button type="button" class="show-all" id="show-all" hidden>Show all ${total} opinions</button>
              <p class="note">Hand-picked, word-for-word quotes from disabled reviewers, accessibility publications and player reviews. Every name and quote links to the original so you can check it yourself.</p>
            </section>
          </div>

          <section aria-labelledby="op-h">
            <h2 class="section-title" id="op-h"><span>◆</span> Public Opinions</h2>
            <p class="sr-status" id="op-status" aria-live="polite" style="position:absolute;left:-9999px"></p>
            <div class="opinions" id="opinions"></div>
          </section>
        </main>
        <footer>Gaming The System · Accessible Gaming Hub · <a href="gaming-hub.html">Back to catalog</a></footer>
      `;

      const heroImg = document.getElementById("hero-img");
      heroImg.addEventListener("error", () => {
        if (!heroImg.dataset.fallback) { heroImg.dataset.fallback = "1"; heroImg.src = `https://img.youtube.com/vi/${g.trailerId}/hqdefault.jpg`; }
      });
      heroImg.addEventListener("load", () => {
        // YouTube serves a 120px grey placeholder when maxres doesn't exist
        if (heroImg.naturalWidth <= 120 && !heroImg.dataset.fallback) { heroImg.dataset.fallback = "1"; heroImg.src = `https://img.youtube.com/vi/${g.trailerId}/hqdefault.jpg`; }
      });

      const list = document.getElementById("opinions");
      const status = document.getElementById("op-status");
      const showAll = document.getElementById("show-all");
      const render = filter => {
        const items = g.opinions.filter(o => !filter || o.sentiment === filter);
        list.innerHTML = items.map(o => `
          <article class="op ${o.sentiment}">
            <span class="badge ${o.sentiment}">${label[o.sentiment]}</span>
            <blockquote><a href="${esc(o.url)}" target="_blank" rel="noopener noreferrer" aria-label="Quote from ${esc(o.author)}: ${esc(o.quote)} (opens original source in a new tab)">${esc(o.quote)}</a></blockquote>
            <div class="who">
              <a href="${esc(o.url)}" target="_blank" rel="noopener noreferrer">${esc(o.author)} ↗</a>
              <span>${esc(o.source)}</span>
              <span>${esc(o.type)}</span>
            </div>
          </article>`).join("");
        status.textContent = filter ? `Showing ${items.length} ${label[filter].toLowerCase()} opinions` : `Showing all ${items.length} opinions`;
        showAll.hidden = !filter;
        document.querySelectorAll(".tally button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.filter === filter)));
      };
      document.querySelectorAll(".tally button").forEach(b => b.addEventListener("click", () => {
        render(b.getAttribute("aria-pressed") === "true" ? null : b.dataset.filter);
      }));
      showAll.addEventListener("click", () => render(null));
      render(null);
    })();
  </script>
</body>
</html>
